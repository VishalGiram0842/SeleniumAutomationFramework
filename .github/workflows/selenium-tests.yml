name: Selenium Automation Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================================
      # JAVA
      # =====================================================

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # =====================================================
      # VERIFY JAVA
      # =====================================================

      - name: Verify Java
        run: |
          java -version
          mvn -version


      # =====================================================
      # RUN TESTS
      # =====================================================

      - name: Run Selenium Tests
        run: |
          mvn clean test \
            -Dbrowser=chrome \
            -Dheadless=true


      # =====================================================
      # SHOW REPORT FILES
      # =====================================================

      - name: List Reports
        if: always()
        run: |
          echo "===== Reports ====="
          find Reports -maxdepth 4 -type f || true


      # =====================================================
      # UPLOAD EXTENT REPORT
      # =====================================================

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: Reports/ExtentReport.html
          if-no-files-found: warn


      # =====================================================
      # UPLOAD ALLURE RESULTS
      # =====================================================

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: Reports/allure-results
          if-no-files-found: warn


      # =====================================================
      # UPLOAD SCREENSHOTS
      # =====================================================

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Reports/screenshots
          if-no-files-found: warn
